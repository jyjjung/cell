  <rect class="bg" width="200" height="200" rx="40"/>
  <text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" font-family="Geist, sans-serif" font-size="90" font-weight="bold" class="fg">
    em.
  </text>
</svg>
